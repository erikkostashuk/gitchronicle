services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      LOG_LEVEL: info
      MAX_COMMITS: "50000"
      MAX_CLONE_SIZE_MB: "500"
    volumes:
      - gc-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build: .
    command: ["pnpm", "worker"]
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      LOG_LEVEL: info
    volumes:
      - gc-data:/app/data
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  gc-data:
