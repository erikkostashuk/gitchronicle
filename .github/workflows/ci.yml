name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Migrate + seed before build: pages are prerendered against the demo
      # project, so a build with no database produces empty routes.
      - name: Migrate database
        run: pnpm db:migrate

      - name: Seed demo project
        run: pnpm seed

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` runs apt-get update, which fails the whole job when the
      # runner image's Microsoft apt sources return 403 (they are unsigned and
      # unrelated to Playwright). Drop those lists first so apt only reads the
      # Ubuntu mirrors it actually needs.
      - name: Remove unrelated apt sources that break apt-get update
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/microsoft.list || true

      # Both engines are required: the `chromium` project uses Desktop Chrome,
      # and the `mobile` project uses the iPhone 13 descriptor, whose
      # defaultBrowserType is webkit. Installing only chromium fails half the suite.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Migrate database
        run: pnpm db:migrate

      # playwright.config.ts webServer runs `pnpm seed && pnpm build && pnpm start`
      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same image Render builds from — a broken Dockerfile is a broken deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gitchronicle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /api/health
        run: |
          docker run -d --name gc -p 3000:3000 gitchronicle:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "healthy"
              docker rm -f gc
              exit 0
            fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs gc
          docker rm -f gc
          exit 1
